<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 가격 변동 분석기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#4f46e5',
                        'secondary': '#8b5cf6',
                        'up-limit': '#ef4444', // 빨간색 (상승)
                        'down-limit': '#3b82f6', // 파란색 (하락)
                    }
                }
            }
        }
    </script>
    <style>
        /* 기본 스크롤바 숨기기 (깔끔한 디자인을 위해) */
        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            background-color: #f3f4f6; /* 밝은 회색 배경 */
        }
        /* 입력 필드의 포커스 스타일 */
        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.4);
        }
        /* type=number의 스피너 버튼 숨기기 (깔끔한 디자인) */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white p-6 md:p-8 rounded-2xl shadow-2xl space-y-6">
        <!-- 입력 섹션 -->
        <div class="space-y-4 pt-2"> 
            
            <!-- 1. 현재 주가 입력 (개별 리셋 아이콘) -->
            <label for="currentPrice" class="block text-sm font-medium text-gray-700">
                1. 현재 주가 (기준가, 원)
            </label>
            <div class="flex items-center space-x-2">
                <div class="flex-grow relative">
                    <!-- debounce(saveLastState, 300) 제거 -->
                    <input type="text" id="currentPrice" placeholder="예: 10,000" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150 text-right font-semibold text-base" inputmode="numeric" oninput="formatInput(this); calculateLimits(); toggleClearButtonVisibility('clearPriceBtn', 'currentPrice')" onfocus="this.select()">
                </div>
                <button
                    id="clearPriceBtn"
                    class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-xl bg-gray-200 text-gray-600 hover:bg-gray-300 active:bg-gray-400 transition duration-150 hidden shadow-sm"
                    onclick="resetInput('currentPrice', true); toggleClearButtonVisibility('clearPriceBtn', 'currentPrice');"
                    title="현재 주가 초기화"
                    aria-label="현재 주가 초기화"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <!-- 2. 주식 수 입력 (개별 리셋 아이콘) -->
            <label for="stockQuantity" class="block text-sm font-medium text-gray-700 pt-2">
                2. 주식 수 (개)
            </label>
            <div class="flex items-center space-x-2">
                <div class="flex-grow relative">
                    <!-- debounce(saveLastState, 300) 제거 -->
                    <input type="text" id="stockQuantity" placeholder="예: 100" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150 text-right font-semibold text-base" inputmode="numeric" oninput="formatInput(this); calculateLimits(); toggleClearButtonVisibility('clearQuantityBtn', 'stockQuantity');" onfocus="this.select()">
                </div>
                <button
                    id="clearQuantityBtn"
                    class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-xl bg-gray-200 text-gray-600 hover:bg-gray-300 active:bg-gray-400 transition duration-150 hidden shadow-sm"
                    onclick="resetInput('stockQuantity', true); toggleClearButtonVisibility('clearQuantityBtn', 'stockQuantity');"
                    title="주식 수 초기화"
                    aria-label="주식 수 초기화"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- 3. 변동률 입력 (기본값 공백으로 수정) -->
            <label for="percentageLimit" class="block text-sm font-medium text-gray-700 pt-2">
                3. 가격 변동률 (%)
            </label>
            <div class="flex items-center space-x-2">
                <div class="flex-grow relative">
                    <!-- debounce(saveLastState, 300) 제거 -->
                    <input type="number" id="percentageLimit" value="" placeholder="예: 30" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150 text-right font-semibold text-base" min="0.01" step="0.01" inputmode="decimal" oninput="calculateLimits(); toggleClearButtonVisibility('clearPercentageBtn', 'percentageLimit');">
                </div>
                <!-- 가격 변동률 초기화 버튼 -->
                <button
                    id="clearPercentageBtn"
                    class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-xl bg-gray-200 text-gray-600 hover:bg-gray-300 active:bg-gray-400 transition duration-150 hidden shadow-sm"
                    onclick="resetInput('percentageLimit', true); toggleClearButtonVisibility('clearPercentageBtn', 'percentageLimit');"
                    title="변동률 초기화 (공백)"
                    aria-label="변동률 초기화 (공백)"
                >
                    <!-- Simple Clear/X Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- 저장 버튼 -->
        <div class="flex justify-end pt-4">
            <button 
                onclick="saveHistory(); saveLastState();"
                class="px-4 py-2 bg-secondary text-white font-bold rounded-xl text-sm hover:bg-secondary/90 transition duration-150 shadow-lg active:scale-95 flex items-center space-x-2"
                title="현재 입력 값을 히스토리에 저장"
            >
                <!-- Save Icon (Floppy Disk) -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                </svg>
                <span>저장하기</span>
            </button>
        </div>
        
        <!-- 결과 표시 섹션 -->
        <div id="resultContainer" class="space-y-4 pt-4 border-t border-gray-200">
            
            <!-- 현재 총 평가 금액 -->
            <div class="bg-gray-100 p-3 rounded-xl shadow-inner border-l-4 border-gray-400 flex justify-between items-center">
                <span class="text-base font-semibold text-gray-700">현재 평가액</span> <!-- 폰트 크기 조정: text-base -->
                <span id="currentTotalValue" class="text-xl font-extrabold text-gray-900">0 원</span> <!-- 폰트 크기 유지: text-xl (중요 강조) -->
            </div>

            <!-- 상승 결과 그룹 -->
            <div class="space-y-3 p-4 border rounded-xl border-up-limit/30 bg-up-limit/5">
                <div class="flex justify-between items-center pb-2 border-b border-up-limit/20">
                    <span class="text-lg font-bold text-up-limit">▲ 상승 (<span id="upperPercent">0</span>%) 도달 시</span> <!-- 폰트 크기 조정: text-lg -->
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-up-limit">주당 예상 가격</span> <!-- 폰트 크기 조정: text-sm -->
                    <span id="upperLimit" class="text-lg font-extrabold text-up-limit">0 원</span> <!-- 폰트 크기 조정: text-lg -->
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-up-limit">총 평가 금액</span> <!-- 폰트 크기 조정: text-sm -->
                    <span id="upperTotalValue" class="text-lg font-extrabold text-up-limit">0 원</span> <!-- 폰트 크기 조정: text-lg -->
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-up-limit/10">
                    <span class="text-base font-bold text-up-limit">총 수익 (세전)</span> <!-- 폰트 크기 조정: text-base -->
                    <span id="upperProfit" class="text-xl font-extrabold text-up-limit">0 원</span> <!-- 폰트 크기 유지: text-xl (중요 강조) -->
                </div>
            </div>

            <!-- 하락 결과 그룹 -->
            <div class="space-y-3 p-4 border rounded-xl border-down-limit/30 bg-down-limit/5">
                <div class="flex justify-between items-center pb-2 border-b border-down-limit/20">
                    <span class="text-lg font-bold text-down-limit">▼ 하락 (<span id="lowerPercent">0</span>%) 도달 시</span> <!-- 폰트 크기 조정: text-lg -->
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-down-limit">주당 예상 가격</span> <!-- 폰트 크기 조정: text-sm -->
                    <span id="lowerLimit" class="text-lg font-extrabold text-down-limit">0 원</span> <!-- 폰트 크기 조정: text-lg -->
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-down-limit">총 평가 금액</span> <!-- 폰트 크기 조정: text-sm -->
                    <span id="lowerTotalValue" class="text-lg font-extrabold text-down-limit">0 원</span> <!-- 폰트 크기 조정: text-lg -->
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-down-limit/10">
                    <span class="text-base font-bold text-down-limit">총 손실 (세전)</span> <!-- 폰트 크기 조정: text-base -->
                    <span id="lowerLoss" class="text-xl font-extrabold text-down-limit">0 원</span> <!-- 폰트 크기 유지: text-xl (중요 강조) -->
                </div>
            </div>
        </div>

        <!-- 히스토리 섹션 -->
        <div class="pt-6 border-t border-gray-200">
            <h2 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2">💾 히스토리 (로컬 저장, 최대 5개)</h2> <!-- 폰트 크기 조정: text-lg -->
            <ul id="historyList" class="space-y-3">
                <!-- History items will be inserted here -->
                <li class="text-gray-500 text-center py-4">히스토리를 로딩 중입니다...</li>
            </ul>
        </div>

        <!-- 메시지 박스 (에러/정보 표시) -->
        <div id="messageBox" class="hidden p-3 text-sm rounded-lg bg-yellow-100 text-yellow-800 mt-4" role="alert">
            <!-- 메시지가 여기에 표시됩니다. -->
        </div>

    </div>

    <script>
        // --- 로컬스토리지 관련 상수 ---
        const HISTORY_KEY = 'stockCalculatorHistory'; // 히스토리 목록 (최대 5개)
        const LAST_STATE_KEY = 'stockCalculatorLastState'; // 마지막 입력값 (페이지 재방문 시 로드)
        const HISTORY_LIMIT = 5; 

        // DOM 요소 가져오기
        const priceInput = document.getElementById('currentPrice');
        const stockQuantityInput = document.getElementById('stockQuantity');
        const percentageInput = document.getElementById('percentageLimit');
        
        const currentTotalValueDisplay = document.getElementById('currentTotalValue');
        const upperLimitDisplay = document.getElementById('upperLimit');
        const upperTotalValueDisplay = document.getElementById('upperTotalValue');
        const upperProfitDisplay = document.getElementById('upperProfit');
        const lowerLimitDisplay = document.getElementById('lowerLimit');
        const lowerTotalValueDisplay = document.getElementById('lowerTotalValue');
        const lowerLossDisplay = document.getElementById('lowerLoss');
        const upperPercentDisplay = document.getElementById('upperPercent');
        const lowerPercentDisplay = document.getElementById('lowerPercent');
        const messageBox = document.getElementById('messageBox');
        const historyList = document.getElementById('historyList');
        
        // 가격을 원화 포맷으로 변환하는 함수
        const formatter = new Intl.NumberFormat('ko-KR');

        // Debounce 설정 (연속적인 입력 시 마지막 한 번만 함수 실행)
        let debounceTimeout = null;
        function debounce(func, delay) {
            clearTimeout(debounceTimeout);
            debounceTimeout = setTimeout(func, delay);
        }

        // --- 로컬스토리지 관리 함수 ---
        
        /**
         * 현재 입력 상태를 로컬스토리지의 LAST_STATE_KEY에 저장합니다.
         * 이 함수는 '저장하기' 버튼 클릭 시에만 호출됩니다. (자동 저장 제거)
         */
        function saveLastState() {
            const priceStr = priceInput.value.replace(/,/g, '');
            const quantityStr = stockQuantityInput.value.replace(/,/g, '');
            const percentStr = percentageInput.value;

            // 모든 값이 비어있으면 저장하지 않음
            if (!priceStr && !quantityStr && !percentStr) {
                // 하지만 마지막 상태 로딩을 위해, 아예 저장하지 않고 리턴.
                // 빈 값이라도 저장해야 재방문 시 빈 상태가 로드되는 경우도 있음.
                // 여기서는 마지막 유효 상태를 저장하는 것으로 가정하고 아래 코드를 유지.
            }
            
            const lastStateData = {
                currentPrice: priceStr,
                stockQuantity: quantityStr,
                percentageLimit: percentStr, // 빈 값 그대로 저장
            };

            try {
                localStorage.setItem(LAST_STATE_KEY, JSON.stringify(lastStateData));
            } catch (error) {
                console.error("Error saving last state:", error);
            }
        }

        /**
         * 로컬스토리지에 저장된 마지막 입력 값을 불러와 Input에 적용합니다.
         */
        function loadLastState() {
            try {
                const lastState = JSON.parse(localStorage.getItem(LAST_STATE_KEY));
                
                if (lastState) {
                    // 값 적용 시 콤마 포맷팅 적용
                    priceInput.value = lastState.currentPrice ? formatter.format(parseInt(lastState.currentPrice, 10)) : '';
                    stockQuantityInput.value = lastState.stockQuantity ? formatter.format(parseInt(lastState.stockQuantity, 10)) : '';
                    // 변동률은 저장된 값을 그대로 사용 (빈 값이면 빈 값으로 로드됨)
                    percentageInput.value = lastState.percentageLimit || ''; 
                }
            } catch (error) {
                console.error("Error loading last state:", error);
            }
        }

        /**
         * 현재 입력값을 localStorage의 히스토리 목록에 저장합니다. (수동 저장)
         */
        function saveHistory() {
            const priceStr = priceInput.value.replace(/,/g, '');
            const quantityStr = stockQuantityInput.value.replace(/,/g, '');
            const percentStr = percentageInput.value;

            // 저장할 값이 유효한지 확인
            if (!priceStr || !quantityStr || !percentStr || priceStr === '0' || quantityStr === '0' || parseFloat(percentStr) <= 0) {
                 showMessage('히스토리에 저장하려면 유효한 주가(1 이상), 주식 수(1 이상), 변동률(0보다 큼)을 입력해야 합니다.', 'error');
                 return;
            }

            const historyData = {
                currentPrice: priceStr,
                stockQuantity: quantityStr,
                percentageLimit: percentStr, 
                timestamp: new Date().getTime() // 저장 시점의 로컬 타임스탬프 (고유 ID 역할)
            };

            try {
                // 1. 기존 히스토리 로드 (JSON 파싱)
                const existingHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');

                // 2. 새 항목을 배열 맨 앞에 추가 (가장 최신 기록)
                existingHistory.unshift(historyData); 

                // 3. 최대 개수(5개)로 자르기
                const newHistory = existingHistory.slice(0, HISTORY_LIMIT);

                // 4. localStorage에 저장
                localStorage.setItem(HISTORY_KEY, JSON.stringify(newHistory));
                
                // 5. UI 업데이트 및 메시지 표시
                renderHistory(newHistory);
                showMessage('현재 입력 값이 히스토리에 저장되었습니다.', 'info');

            } catch (error) {
                console.error("Error saving history to localStorage:", error);
                showMessage(`히스토리 저장 실패: ${error.message}`, 'error');
            }
        }
        
        /**
         * 특정 타임스탬프를 가진 히스토리 항목을 삭제하고 목록을 새로 고칩니다.
         * @param {string} timestamp - 삭제할 항목의 타임스탬프 (문자열)
         */
        function deleteHistoryItem(timestamp) {
            try {
                const existingHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                const targetTimestamp = parseInt(timestamp, 10);

                // 타임스탬프가 일치하지 않는 항목만 필터링하여 남깁니다.
                const newHistory = existingHistory.filter(item => item.timestamp !== targetTimestamp);

                localStorage.setItem(HISTORY_KEY, JSON.stringify(newHistory));
                
                // UI 업데이트
                renderHistory(newHistory);
                showMessage('히스토리 항목이 성공적으로 삭제되었습니다.', 'info');
            } catch (error) {
                console.error("Error deleting history item:", error);
                showMessage(`히스토리 삭제 실패: ${error.message}`, 'error');
            }
        }

        /**
         * localStorage에서 히스토리 목록을 불러와 UI를 업데이트합니다.
         */
        function loadAndRenderHistory() {
            try {
                const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                renderHistory(history);
            } catch (error) {
                console.error("Error loading history from localStorage:", error);
                historyList.innerHTML = `<p class="text-red-500 text-center py-4 text-sm">히스토리 로딩 중 오류 발생: ${error.message}</p>`;
            }
        }

        /**
         * 히스토리 데이터를 기반으로 목록 UI를 렌더링합니다.
         * @param {Array<Object>} history - 표시할 히스토리 객체 배열
         */
        function renderHistory(history) {
            historyList.innerHTML = '';
            
            if (history.length === 0) {
                historyList.innerHTML = '<p class="text-gray-500 text-center py-4 text-sm">저장된 히스토리가 없습니다. "저장하기" 버튼을 눌러 기록을 남겨보세요.</p>';
                return;
            }

            history.forEach((data) => {
                // UI 표시를 위한 값 포맷팅
                const price = data.currentPrice ? formatter.format(parseInt(data.currentPrice, 10)) : '0';
                const quantity = data.stockQuantity ? formatter.format(parseInt(data.stockQuantity, 10)) : '0';
                const percent = data.percentageLimit || '0';
                
                // 타임스탬프 포맷팅
                const date = new Date(data.timestamp);
                const time = date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

                // 리스트 항목 생성
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center p-3 bg-white hover:bg-gray-50 rounded-xl border border-gray-200 transition duration-150 shadow-sm';
                li.innerHTML = `
                    <div class="flex-1 min-w-0 pr-3 space-y-1">
                        <p class="text-sm font-semibold text-gray-800 truncate">
                            주가: ${price}원 · 수량: ${quantity}개
                        </p>
                        <p class="text-xs text-gray-500">
                            변동률: ${percent}% (${time})
                        </p>
                    </div>
                    <div class="flex space-x-2 flex-shrink-0">
                        <button 
                            class="load-btn px-3 py-1 bg-primary text-white text-sm font-medium rounded-full hover:bg-primary/90 transition duration-150 shadow-md active:scale-95"
                            data-price="${data.currentPrice}"
                            data-quantity="${data.stockQuantity}"
                            data-percent="${data.percentageLimit || ''}"
                            title="입력값 불러오기"
                        >
                            불러오기
                        </button>
                        <button 
                            class="delete-btn px-3 py-1 bg-red-500 text-white text-sm font-medium rounded-full hover:bg-red-600 transition duration-150 shadow-md active:scale-95"
                            data-timestamp="${data.timestamp}"
                            title="히스토리 삭제"
                        >
                            삭제
                        </button>
                    </div>
                `;
                
                // "불러오기" 버튼 이벤트 리스너
                li.querySelector('.load-btn').addEventListener('click', (e) => loadValues(e.currentTarget));
                
                // "삭제" 버튼 이벤트 리스너 추가
                li.querySelector('.delete-btn').addEventListener('click', (e) => {
                    const timestamp = e.currentTarget.getAttribute('data-timestamp');
                    deleteHistoryItem(timestamp);
                });
                
                historyList.appendChild(li);
            });
        }

        /**
         * 히스토리 버튼 클릭 시 해당 값을 입력 필드에 적용하고 계산합니다.
         */
        function loadValues(button) {
            const price = button.getAttribute('data-price');
            const quantity = button.getAttribute('data-quantity');
            const percent = button.getAttribute('data-percent');

            // 입력 필드에 값 적용 (표시를 위해 다시 포맷팅)
            priceInput.value = price ? formatter.format(parseInt(price, 10)) : '';
            stockQuantityInput.value = quantity ? formatter.format(parseInt(quantity, 10)) : '';
            percentageInput.value = percent;

            // 계산 및 UI 업데이트 트리거
            calculateLimits();
            toggleClearButtonVisibility('clearPriceBtn', 'currentPrice');
            toggleClearButtonVisibility('clearQuantityBtn', 'stockQuantity');
            toggleClearButtonVisibility('clearPercentageBtn', 'percentageLimit');
            
            // 마지막 입력 값도 업데이트 (저장하기 버튼 클릭 시에만 저장되도록 변경했으므로, 여기서 호출하지 않음)
            // saveLastState(); // 수동 저장으로 변경되어 주석 처리
            showMessage('히스토리가 성공적으로 로드되었습니다.', 'info');
        }


        // --- 계산 및 UI 헬퍼 함수 (기존 함수) ---

        /**
         * 입력 필드에 콤마를 추가하고, 정수만 남도록 처리합니다.
         */
        function formatInput(input) {
            const value = input.value.replace(/[^0-9]/g, '');

            if (value) {
                const numValue = parseInt(value, 10);
                if (numValue < 0 || isNaN(numValue)) {
                    input.value = '';
                } else {
                    input.value = formatter.format(numValue);
                }
            } else {
                input.value = '';
            }
        }

        /**
         * 결과를 모두 0으로 초기화합니다.
         */
        function resetResults() {
            currentTotalValueDisplay.textContent = '0 원';
            upperLimitDisplay.textContent = '0 원';
            upperTotalValueDisplay.textContent = '0 원';
            upperProfitDisplay.textContent = '0 원';
            lowerLimitDisplay.textContent = '0 원';
            lowerTotalValueDisplay.textContent = '0 원';
            lowerLossDisplay.textContent = '0 원';
        }

        /**
         * 메시지 박스를 표시하거나 숨깁니다.
         */
        function showMessage(message, type = 'info') {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-yellow-100', 'text-yellow-800');

            if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-red-800');
            } else {
                messageBox.classList.add('bg-yellow-100', 'text-yellow-800');
            }
            messageBox.classList.remove('hidden');
        }

        /**
         * 특정 입력 필드의 값을 초기화하고 계산을 다시 실행합니다.
         * @param {string} id - 입력 필드의 ID ('currentPrice', 'stockQuantity', 'percentageLimit')
         * @param {boolean} clearValue - true면 값을 완전히 비웁니다. (변동률 포함)
         */
        function resetInput(id, clearValue) {
            const input = document.getElementById(id);
            if (!input) return;

            // 이제 변동률 포함 모든 리셋은 값을 완전히 비움
            if (clearValue) {
                input.value = '';
            }
            
            calculateLimits();
            // saveLastState(); // 수동 저장으로 변경되어 제거
            input.focus();
        }

        /**
         * 입력값 유무에 따라 리셋 아이콘의 표시 여부를 토글합니다.
         */
        function toggleClearButtonVisibility(buttonId, inputId) {
            const button = document.getElementById(buttonId);
            const input = document.getElementById(inputId);

            if (!button || !input) return;

            const cleanValue = input.value.replace(/,/g, '').trim();
            
            // 모든 입력 필드에 대해, 값이 비어있지 않으면 버튼 표시
            if (cleanValue.length > 0) {
                button.classList.remove('hidden');
            } else {
                button.classList.add('hidden');
            }
        }

        /**
         * 상승/하락 가격을 계산하고 결과를 표시합니다.
         */
        function calculateLimits() {
            const priceStr = priceInput.value.replace(/,/g, '');
            const price = parseInt(priceStr, 10);
            const quantityStr = stockQuantityInput.value.replace(/,/g, '');
            const quantity = parseInt(quantityStr, 10);
            
            // 변동률이 빈 값일 경우를 대비해 trim() 후 parseFloat
            const percentStr = percentageInput.value.trim();
            let percent = parseFloat(percentStr);

            messageBox.classList.add('hidden');
            messageBox.textContent = '';
            
            // 입력값 유효성 검사
            if (isNaN(price) || price <= 0 || isNaN(quantity) || quantity < 0 || isNaN(percent) || percent <= 0) {
                resetResults();
                
                // 어떤 값이 문제인지 명확히 표시
                if (priceInput.value !== '' && (isNaN(price) || price <= 0)) showMessage('유효한 주가(1 이상의 숫자)를 입력해 주세요.', 'error');
                else if (stockQuantityInput.value !== '' && (isNaN(quantity) || quantity < 0)) showMessage('유효한 주식 수(0 이상의 숫자)를 입력해 주세요.', 'error');
                // 변동률이 공백이거나 0이하일 경우
                else if (percentStr !== '' && (isNaN(percent) || percent <= 0)) showMessage('유효한 변동률(0보다 큰 숫자)을 입력해 주세요.', 'error');
                else if (percentStr === '') showMessage('가격 변동률을 입력해 주세요.', 'error');
                
                upperPercentDisplay.textContent = isNaN(percent) || percent <= 0 ? 0 : percent;
                lowerPercentDisplay.textContent = isNaN(percent) || percent <= 0 ? 0 : percent;
                return;
            }

            const rateMultiplier = percent / 100;
            const upperRate = 1 + rateMultiplier;
            const lowerRate = 1 - rateMultiplier;
            
            upperPercentDisplay.textContent = percent;
            lowerPercentDisplay.textContent = percent;
            
            const currentTotalValue = price * quantity;
            currentTotalValueDisplay.textContent = `${formatter.format(currentTotalValue)} 원`;

            // 상승 계산
            const finalUpperLimit = Math.ceil(price * upperRate);
            const upperTotalValue = finalUpperLimit * quantity;
            const upperProfit = upperTotalValue - currentTotalValue;

            upperLimitDisplay.textContent = `${formatter.format(finalUpperLimit)} 원`;
            upperTotalValueDisplay.textContent = `${formatter.format(upperTotalValue)} 원`;
            upperProfitDisplay.textContent = `${formatter.format(upperProfit)} 원`;

            // 하락 계산
            const finalLowerLimit = Math.max(0, Math.floor(price * lowerRate));
            const lowerTotalValue = finalLowerLimit * quantity;
            const lowerLoss = currentTotalValue - lowerTotalValue;

            lowerLimitDisplay.textContent = `${formatter.format(finalLowerLimit)} 원`;
            lowerTotalValueDisplay.textContent = `${formatter.format(lowerTotalValue)} 원`;
            lowerLossDisplay.textContent = `${formatter.format(lowerLoss)} 원`;
            
            showMessage(`계산된 가격은 ±${percent}%를 기준으로, 1원 단위로 올림(상승) 및 내림(하락) 처리되었습니다.`, 'info');
        }

        // Enter 키 이벤트 리스너
        priceInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') calculateLimits(); });
        stockQuantityInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') calculateLimits(); });
        percentageInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') calculateLimits(); });

        // 초기 로드 시 히스토리 로딩 및 계산 실행
        window.onload = function() {
            resetResults();
            loadLastState(); // 1. 마지막 입력 값 로드
            loadAndRenderHistory(); // 2. 히스토리 목록 로드
            calculateLimits(); // 3. 로드된 값을 기반으로 계산
            
            // 초기 로드 시 리셋 버튼 가시성 설정
            toggleClearButtonVisibility('clearPriceBtn', 'currentPrice');
            toggleClearButtonVisibility('clearQuantityBtn', 'stockQuantity');
            toggleClearButtonVisibility('clearPercentageBtn', 'percentageLimit'); 
        };
    </script>
</body>
</html>
