<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB 국민은행 정기예금 금리 정보</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tailwind CSS 설정 */
        :root {
            --kb-main: #8C222D; /* 국민은행 시그니처 색상 */
            --kb-light: #fbecec;
        }

        body {
            font-family: 'Inter', 'Malgun Gothic', sans-serif;
            background-color: #f7f7f7;
        }

        /* 커스텀 스타일 */
        .kb-header {
            background-color: var(--kb-main);
            color: white;
        }
        
        .kb-table-header th {
            background-color: var(--kb-main);
            color: white;
        }
        
        .kb-hover:hover {
            background-color: var(--kb-light);
            transition: background-color 0.3s;
        }

        /* 테이블 둥근 모서리 처리 */
        .rounded-table {
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 0.5rem;
            overflow: hidden; /* 자식 요소의 둥근 모서리 적용을 위해 */
        }
    </style>
</head>
<body class="p-4 sm:p-8 flex justify-center items-start min-h-screen">

    <div class="container w-full max-w-5xl bg-white rounded-xl shadow-2xl p-6 sm:p-10">
        
        <header class="mb-8 p-4 rounded-lg kb-header text-center">
            <h1 class="text-3xl font-extrabold">🏦 KB 국민은행 정기예금 금리 조회</h1>
        </header>
        
        <div class="info bg-gray-50 border-l-4 border-yellow-500 text-gray-700 p-4 rounded-lg mb-6">
            <p class="font-semibold mb-2">📢 중요: API 호출 실패 시 대처 방법</p>
            <ul class="list-disc list-inside text-sm space-y-1">
                <li>**"Failed to fetch" 오류**는 대부분 브라우저의 **CORS 보안 정책** 위반 때문입니다.</li>
                <li>API 키 발급 시 등록한 **서비스 URL**이 현재 코드를 실행하는 주소(도메인)와 정확히 일치하는지 확인해 주세요.</li>
                <li>로컬(`.html` 파일) 실행 시 오류가 발생할 수 있습니다. 웹 서버 환경(예: GitHub Pages)에서 실행을 시도해 보세요.</li>
            </ul>
        </div>
        
        <div id="rate-list" class="loading text-center p-8 text-xl font-medium text-gray-600">
            데이터를 불러오는 중입니다...
        </div>

    </div>

    <script>
        // 사용자님이 제공해주신 API 키를 적용합니다.
        const API_KEY = "b6930932f0e9698b85c11645650d2e"; 
        
        // 필터링할 은행명
        const TARGET_BANK_NAME = "국민은행"; 

        // 금융감독원 '정기예금 상품 검색' API 엔드포인트
        const BASE_URL = "http://finlife.fss.or.kr/finlifeapi/depositProductsSearch.json";

        // 요청 변수 설정: 은행권역 전체(020000) 데이터를 가져옵니다.
        const PARAM = {
            auth: API_KEY,             // API 키
            topFinGrpNo: "020000",     // 금융권역코드: 020000 (은행)
            pageNo: "1"                // 페이지 번호
        };
        
        const queryString = new URLSearchParams(PARAM).toString();
        const API_URL = `${BASE_URL}?${queryString}`;


        // API 호출 및 데이터 표시 함수
        async function fetchBankRates() {
            const container = document.getElementById('rate-list');
            
            try {
                // API 호출
                const response = await fetch(API_URL);

                if (!response.ok) {
                    // HTTP 상태 코드가 실패인 경우 (400, 401, 403 등)
                    let errorDetails = `HTTP ${response.status} 응답`;
                    
                    try {
                        const errorData = await response.json();
                        // 금융감독원 API의 오류 코드를 추출하여 사용자에게 표시합니다.
                        if (errorData.error) {
                            errorDetails = `CODE: ${errorData.error.errcode}, MSG: ${errorData.error.errmsg}`;
                        } else {
                            // JSON은 받았으나 예상치 못한 오류 구조일 경우
                            errorDetails = JSON.stringify(errorData, null, 2);
                        }
                    } catch (e) {
                        // JSON 응답이 아닌 경우 (예: CORS 실패로 인한 빈 응답 또는 HTML 응답)
                        errorDetails += " (CORS 또는 키 등록 문제로 응답 본문 확인 불가)";
                    }
                    
                    throw new Error(errorDetails);
                }

                // 응답 성공
                const data = await response.json();
                
                if (!data.result || !data.result.baseList) {
                     throw new Error("API 응답 구조가 유효하지 않습니다. 키 등록 정보를 다시 확인하세요.");
                }

                const baseList = data.result.baseList;
                const optionList = data.result.optionList;

                if (!baseList || baseList.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">현재 표시할 금리 정보가 없습니다.</p>';
                    return;
                }

                // 1. KB 국민은행 상품만 필터링
                const kbBaseList = baseList.filter(base => base.kor_co_nm === TARGET_BANK_NAME);

                if (kbBaseList.length === 0) {
                     container.innerHTML = `<p class="text-lg font-bold text-red-500"><strong>${TARGET_BANK_NAME}</strong>의 금리 정보가 API 검색 결과에 없습니다.</p>`;
                     return;
                }
                
                // 2. BaseList와 OptionList를 결합하여 KB 상품 데이터 생성
                const combinedData = kbBaseList.map(base => {
                    // 해당 상품의 금리 옵션만 필터링
                    const options = optionList.filter(opt => opt.fin_prdt_cd === base.fin_prdt_cd);
                    
                    // 가장 높은 최고 우대금리 옵션을 찾아서 표시
                    const maxRateOption = options.reduce((max, current) => 
                        (parseFloat(current.max_int_rate) > parseFloat(max.max_int_rate) ? current : max), 
                        { max_int_rate: 0, intr_rate: 0, save_trm: '' }
                    );

                    return {
                        productName: base.fin_prdt_nm,
                        maxRate: maxRateOption.max_int_rate || '-',
                        baseRate: maxRateOption.intr_rate || '-',
                        term: maxRateOption.save_trm ? `${maxRateOption.save_trm}개월` : '-'
                    };
                });


                // 3. 테이블 생성
                let tableHTML = '<div class="overflow-x-auto"><table class="w-full text-sm text-left text-gray-700 rounded-table shadow-lg">';
                tableHTML += '<thead class="kb-table-header text-xs uppercase">';
                tableHTML += '<tr><th scope="col" class="px-6 py-3">상품명</th><th scope="col" class="px-6 py-3">기간</th><th scope="col" class="px-6 py-3">기본 금리 (%)</th><th scope="col" class="px-6 py-3">최고 우대금리 (%)</th></tr>';
                tableHTML += '</thead>';
                tableHTML += '<tbody>';

                combinedData.forEach(item => {
                    tableHTML += `
                        <tr class="bg-white border-b kb-hover">
                            <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">${item.productName}</td>
                            <td class="px-6 py-4">${item.term}</td>
                            <td class="px-6 py-4 text-green-600 font-semibold">${item.baseRate}</td>
                            <td class="px-6 py-4 text-red-600 font-bold">${item.maxRate}</td>
                        </tr>
                    `;
                });

                tableHTML += '</tbody></table></div>';
                container.innerHTML = tableHTML;

            } catch (error) {
                // 오류 메시지 표시
                console.error("데이터 처리 중 오류 발생:", error);
                container.innerHTML = `<div class="error bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-lg mt-8">
                    <p class="font-bold">데이터 호출 실패 (Critical Error)</p>
                    <p class="mt-2 text-sm"><strong>오류 내용:</strong> ${error.message}</p>
                    <p class="mt-2 text-xs text-gray-600">이 오류는 주로 브라우저 보안 정책 (CORS) 위반 또는 API 키가 유효한 도메인에 등록되지 않아 발생합니다. 코드는 정확하며, 실행 환경을 점검해야 합니다.</p>
                </div>`;
            }
        }

        // 함수 실행
        fetchBankRates();

    </script>

</body>
</html>
