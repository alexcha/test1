<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 제목을 '금융 도구'로 변경했습니다. -->
    <title>금융 도구</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Inter 폰트 설정 및 기본 스타일 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            /* body의 margin/padding 제거: 전체 화면 사용 보장 */
            margin: 0;
            padding: 0;
        }
        #app {
            min-height: 100vh;
        }

        /* ⭐️ iFrame 컨테이너 높이 계산 (하단 탭 공간을 고려) */
        .iframe-fixed-height {
            /* 탭이 2줄이므로 약 80px 정도를 상단 공간으로 확보합니다. */
            height: calc(100vh - 80px); 
        }

        /* iFrame이 부모 높이를 채우도록 합니다. */
        .tab-pane iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 탭 버튼 간격 및 정렬을 위한 CSS */
        .tab-grid {
            display: grid;
            /* 모바일에서 4열로 고정 */
            grid-template-columns: repeat(4, minmax(0, 1fr)); 
            gap: 8px; /* 그리드 간격 처리 */
        }
    </style>
</head>
<body class="flex flex-col">

    <div id="app" class="w-full mx-auto px-1 flex flex-col">
        
        <!-- 탭 버튼 컨테이너: 4열 그리드 (5개 탭이 2줄에 걸쳐 표시됨) -->
        <div class="tab-grid bg-white p-2 rounded-xl shadow-md mb-2 sticky top-0 z-10">
            
            <!-- 1행: 4개 탭 -->
            <button id="tab-money"
                    class="tab-button py-1 px-1 text-sm font-semibold rounded-lg transition-all duration-200 whitespace-nowrap"
                    data-tab="money">
                매출
            </button>
            <button id="tab-cal"
                    class="tab-button py-1 px-1 text-sm font-semibold rounded-lg transition-all duration-200 whitespace-nowrap"
                    data-tab="cal">
                매도
            </button>
            <button id="tab-cal2"
                    class="tab-button py-1 px-1 text-sm font-semibold rounded-lg transition-all duration-200 whitespace-nowrap"
                    data-tab="cal2">
                물타기
            </button>
            <button id="tab-cal3"
                    class="tab-button py-1 px-1 text-sm font-semibold rounded-lg transition-all duration-200 whitespace-nowrap"
                    data-tab="cal3">
                계산기
            </button>
            
            <!-- 2행: 1개 탭 + 빈 공간 3개 -->
            <button id="tab-cal4"
                    class="tab-button py-1 px-1 text-sm font-semibold rounded-lg transition-all duration-200 whitespace-nowrap"
                    data-tab="cal4">
                변동
            </button>
            
            <!-- 2행의 나머지 3칸을 채워 레이아웃을 유지합니다. (선택 사항이지만 유지) -->
            <div></div> 
            <div></div> 
            <div></div>
        </div>

        <div id="tab-content" class="bg-white p-0 rounded-xl shadow-xl overflow-hidden flex flex-col">

            <div id="content-money" class="tab-pane w-full overflow-y-auto iframe-fixed-height hidden">
                <iframe id="iframe-money" src="money.html"></iframe>
            </div>

            <div id="content-cal" class="tab-pane w-full overflow-y-auto iframe-fixed-height hidden">
                <iframe id="iframe-cal" src="cal.html"></iframe>
            </div>
            
            <div id="content-cal2" class="tab-pane w-full overflow-y-auto iframe-fixed-height hidden">
                <iframe id="iframe-cal2" src="cal2.html"></iframe>
            </div>
            
            <!-- 4번째 탭 콘텐츠 복원 -->
            <div id="content-cal3" class="tab-pane w-full overflow-y-auto iframe-fixed-height hidden">
                <iframe id="iframe-cal3" src="cal3.html"></iframe>
            </div>
            
            <!-- 5번째 탭 콘텐츠 복원 -->
            <div id="content-cal4" class="tab-pane w-full overflow-y-auto iframe-fixed-height hidden">
                <iframe id="iframe-cal4" src="cal4.html"></iframe>
            </div>

            <div id="instruction-message" class="p-8 text-center text-gray-500">
                <p class="text-xl font-bold text-indigo-600">파일 내용을 보려면 탭을 선택하세요.</p>
                <p class="text-sm mt-3 border-t pt-3">
                    **주의:** 이 HTML 파일과 **같은 폴더**에 **다섯** 개의 파일이 있어야 합니다.
                </p>
            </div>

        </div>
    </div>

    <script>
        // JavaScript for Tab Functionality

        document.addEventListener('DOMContentLoaded', () => {
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabPanes = document.querySelectorAll('.tab-pane');
            const instructionMessage = document.getElementById('instruction-message');
            const LAST_TAB_KEY = 'lastActiveTab'; // localStorage 키
            
            // 1. 마지막으로 저장된 탭 이름 로드 (없으면 'money' 기본값)
            const initialTab = localStorage.getItem(LAST_TAB_KEY) || 'money';

            function switchTab(tabName) {
                // 탭 이름을 저장합니다.
                localStorage.setItem(LAST_TAB_KEY, tabName);

                // 1. 버튼 스타일 업데이트
                tabButtons.forEach(button => {
                    const isActive = button.getAttribute('data-tab') === tabName;
                    
                    if (isActive) {
                        button.classList.add('bg-indigo-600', 'text-white', 'shadow-lg');
                        button.classList.remove('bg-gray-100', 'text-gray-700', 'hover:bg-indigo-50');
                    } else {
                        button.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg');
                        button.classList.add('bg-gray-100', 'text-gray-700', 'hover:bg-indigo-50');
                    }
                });

                // 2. 내용 패널 업데이트 및 iFrame 새로고침
                tabPanes.forEach(pane => {
                    const currentTabName = pane.id.replace('content-', '');
                    
                    if (currentTabName === tabName) {
                        pane.classList.remove('hidden');
                        
                        // iFrame 새로고침 (캐싱 문제 해결)
                        const iframe = document.getElementById(`iframe-${tabName}`);
                        if (iframe) {
                            let src = iframe.getAttribute('src').split('?')[0];
                            iframe.src = `${src}?_t=${new Date().getTime()}`;
                        }
                    } else {
                        pane.classList.add('hidden');
                    }
                });

                // 3. 안내 메시지 숨기기 (탭이 선택되면)
                if (instructionMessage) {
                    instructionMessage.classList.add('hidden');
                }
            }

            // 이벤트 리스너 부착
            tabButtons.forEach(button => {
                button.addEventListener('click', (e) => {
                    const tabName = e.currentTarget.getAttribute('data-tab');
                    switchTab(tabName);
                });
            });

            // 초기 로드 시 마지막으로 활성화되었던 탭을 활성화합니다.
            // 제거되었던 탭이 남아있는 경우, 'money' 탭을 기본값으로 사용하도록 로직을 복원합니다.
            const allValidTabs = ['money', 'cal', 'cal2', 'cal3', 'cal4'];
            const safeInitialTab = allValidTabs.includes(initialTab) ? initialTab : 'money';

            switchTab(safeInitialTab); 
        });
    </script>
</body>
</html>
